name: RDP

on:
  workflow_dispatch:
    inputs:
      ts_hostname:
        description: "Tailscale Hostname (e.g., amjad1, amjad2)"
        required: true
        default: "amjad1"

permissions: write-all

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Policy Bypass
        run: |
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item C:\secpol.cfg -Force

          $securePass = ConvertTo-SecureString "rdp123456" -AsPlainText -Force
          
          $user = Get-LocalUser -Name "rdp" -ErrorAction SilentlyContinue
          if (-not $user) {
              New-LocalUser -Name "rdp" -Password $securePass -AccountNeverExpires
          } else {
              Set-LocalUser -Name "rdp" -Password $securePass
              Enable-LocalUser -Name "rdp"
          }

          Add-LocalGroupMember -Group "Administrators" -Member "rdp" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdp" -ErrorAction SilentlyContinue

      - name: Download File, Move to Desktop Root & Install Automation Tools
        shell: pwsh
        run: |
          Write-Host "Installing gdown..."
          pip install gdown -q
          
          $desktopPath = "C:\Users\Public\Desktop"
          Set-Location -Path $desktopPath
          
          Write-Host "Downloading file from Google Drive..."
          gdown "https://drive.google.com/uc?id=1Xl3NQ06dCIVT2i1R0VCLLxoJ1LBDP4QV"
          
          # 1. Extract ZIP Archive
          $archives = Get-ChildItem -Path $desktopPath | Where-Object { $_.Extension -match "\.(zip|rar)$" }
          foreach ($archive in $archives) {
              Write-Host "Extracting $($archive.Name)..."
              7z x "$($archive.FullName)" -o"$desktopPath" -y
              Write-Host "Extracted successfully!"
          }

          # 2. Copy all files from nested inner folders directly to Desktop Root
          Write-Host "Moving all subfolder contents to Desktop root..."
          Get-ChildItem -Path $desktopPath -Recurse -File | ForEach-Object {
              if ($_.DirectoryName -ne $desktopPath) {
                  Copy-Item -Path $_.FullName -Destination $desktopPath -Force
              }
          }

          # 3. Install Macro Recorder / Auto Clicker EXEs
          Write-Host "Searching and installing EXE automation setups..."
          $exeFiles = Get-ChildItem -Path $desktopPath -Filter "*.exe" -Recurse
          foreach ($exe in $exeFiles) {
              Write-Host "Installing $($exe.Name)..."
              Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/S", "/quiet" -NoNewWindow -Wait
          }
          Write-Host "All automation tools processing completed!"

          # 4. Google Chrome Extensions Setup
          $chromePolicyPath = "HKLM:\Software\Policies\Google\Chrome\ExtensionInstallForcelist"
          if (!(Test-Path $chromePolicyPath)) { New-Item -Path $chromePolicyPath -Force | Out-Null }
          New-ItemProperty -Path $chromePolicyPath -Name "1" -Value "majdfhpaihoncoakbjgbdhglocklcgno;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $chromePolicyPath -Name "2" -Value "lfkgcfakbpblpflbjanpoaipofoodnen;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=${{ github.event.inputs.ts_hostname }} --accept-routes
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "$env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

      - name: Maintain Connection
        run: |
          Write-Host "`n=================="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Hostname: ${{ github.event.inputs.ts_hostname }}"
          Write-Host "Username: rdp"
          Write-Host "Password: rdp123456"
          Write-Host "==================`n"
          
          for ($i = 0; $i -lt 71; $i++) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
