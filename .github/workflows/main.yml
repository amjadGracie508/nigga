name: RDP

on:
  workflow_dispatch:

permissions: write-all

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Set Screen Resolution for Better Display
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Set Password for Main GitHub User (runneradmin)
        run: |
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item C:\secpol.cfg -Force

          $username = "runneradmin"
          $password = "1"
          
          $securePass = ConvertTo-SecureString$password -AsPlainText -Force
          Set-LocalUser -Name $username -Password$securePass
          
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          
          echo "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV

      - name: Install Browser Extensions
        run: |
          $chromePath = "HKLM:\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist"
          if (-not (Test-Path $chromePath)) { New-Item -Path$chromePath -Force | Out-Null }
          New-ItemProperty -Path $chromePath -Name "1" -Value "lfkgcfakbpblpflbjanpoaipofoodnen;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $chromePath -Name "2" -Value "majdfhpaihoncoakbjgbdhglocklcgno;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          
          $edgePath = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist"
          if (-not (Test-Path $edgePath)) { New-Item -Path$edgePath -Force | Out-Null }
          New-ItemProperty -Path $edgePath -Name "1" -Value "pciakllldcajllepkbbihkmfkikheffb;https://edge.microsoft.com/extensionwebstorebase/v1/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $edgePath -Name "2" -Value "gmgoamodcdcjnbaobigkjelfplakmdhh;https://edge.microsoft.com/extensionwebstorebase/v1/crx" -PropertyType String -Force | Out-Null

      - name: Install Macro Recorder & AnyDesk
        shell: pwsh
        run: |
          $desktopPath = "C:\Users\Public\Desktop"
          $rarPath = "$desktopPath\amjad_secret.rar"
          $extractPath = "$desktopPath\amjad_secret_extracted"
          
          $directUrl = "https://drive.google.com/uc?export=download&id=1vhj1T94IFssFmckNgifW-gBJNci4Rc53"
          
          Write-Host "Downloading Macro Recorder & Secret files..."
          Invoke-WebRequest -Uri $directUrl -OutFile$rarPath
          
          if (Test-Path $rarPath) { & "C:\Program Files\7-Zip\7z.exe" x $rarPath -o"$extractPath" -y }
          
          Write-Host "Installing Macro Recorder Setup..."
          $installerPath = "$extractPath\MacroRecorderSetup.exe"
          if (Test-Path $installerPath) {
              Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/quiet", "/NORESTART" -Wait
          }

          Write-Host "Registering Macro Recorder in Registry..."
          $regPath = "HKCU:\SOFTWARE\Jitbit\Macro Recorder"
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force \vert{} Out-Null }$serialKey = "HGCNNGujba4SdhQELI56YkubWcJe4MMhOw6mrqdA3WdWKp63lGmQgQSw"
          New-ItemProperty -Path $regPath -Name "Email" -Value "1" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $regPath -Name "Code" -Value $serialKey -PropertyType String -Force | Out-Null

          Write-Host "Downloading and Installing AnyDesk..."
          $anydeskUrl = "https://download.anydesk.com/AnyDesk.exe"
          $anydeskPath = "$env:TEMP\AnyDesk.exe"
          
          Invoke-WebRequest -Uri $anydeskUrl -OutFile$anydeskPath
          
          Start-Process -FilePath $anydeskPath -ArgumentList "--install", "C:\AnyDesk", "--silent", "--start-with-win" -Wait
          
          Start-Sleep -Seconds 5
          
          Write-Host "Setting AnyDesk Password for Unattended Access..."
          cmd.exe /c "echo Mtass$721 | C:\AnyDesk\AnyDesk.exe --set-password"
          
          Start-Sleep -Seconds 5
          
          Write-Host "Getting AnyDesk ID..."
          $anydeskId = cmd.exe /c "C:\AnyDesk\AnyDesk.exe --get-id"
          echo "ANYDESK_ID=$anydeskId" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile$installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=ahmad --accept-routes$tsIP = $null$retries = 0
          while (-not
