name: RDP

on:
  workflow_dispatch:

permissions: write-all

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Policy Bypass
        run: |
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item C:\secpol.cfg -Force

          $securePass = ConvertTo-SecureString "rdp123456" -AsPlainText -Force
          
          $user = Get-LocalUser -Name "rdp" -ErrorAction SilentlyContinue
          if (-not $user) {
              New-LocalUser -Name "rdp" -Password $securePass -AccountNeverExpires
          } else {
              Set-LocalUser -Name "rdp" -Password $securePass
              Enable-LocalUser -Name "rdp"
          }

          Add-LocalGroupMember -Group "Administrators" -Member "rdp" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdp" -ErrorAction SilentlyContinue

      - name: Download File, Extract & Install Automation Tools + Urban VPN
        shell: pwsh
        run: |
          Write-Host "Installing gdown..."
          pip install gdown -q
          Set-Location -Path "C:\Users\Public\Desktop"
          Write-Host "Downloading file from Google Drive..."
          gdown "https://drive.google.com/uc?id=1WgcAipfuH2bgC1tnsB7VtOTdf9qTq-1H"
          
          $archives = Get-ChildItem -Path "C:\Users\Public\Desktop" | Where-Object { $_.Extension -match "\.(zip|rar)$" }
          foreach ($archive in $archives) {
              Write-Host "Extracting $($archive.Name)..."
              7z x "$($archive.FullName)" -o"C:\Users\Public\Desktop" -y
              Write-Host "Extracted successfully!"
          }

          Write-Host "Installing Macro Recorder..."
          $macroSetup = Get-ChildItem -Path "C:\Users\Public\Desktop" -Filter "*Macro*Recorder*.exe" -Recurse | Select-Object -First 1
          if ($macroSetup) {
              Start-Process -FilePath $macroSetup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/S", "/quiet" -NoNewWindow
              Write-Host "Macro Recorder Installed!"
          } else {
              $exeFiles = Get-ChildItem -Path "C:\Users\Public\Desktop" -Filter "*.exe" -Recurse
              foreach ($exe in $exeFiles) {
                  Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/S", "/quiet" -NoNewWindow
              }
          }

          # 1. Google Chrome Extensions Setup
          $chromePolicyPath = "HKLM:\Software\Policies\Google\Chrome\ExtensionInstallForcelist"
          if (!(Test-Path $chromePolicyPath)) { New-Item -Path $chromePolicyPath -Force | Out-Null }
          New-ItemProperty -Path $chromePolicyPath -Name "1" -Value "majdfhpaihoncoakbjgbdhglocklcgno;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $chromePolicyPath -Name "2" -Value "lfkgcfakbpblpflbjanpoaipofoodnen;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null

          # 2. Microsoft Edge Extensions Setup (Including Urban VPN from Edge Store)
          $edgePolicyPath = "HKLM:\Software\Policies\Microsoft\Edge\ExtensionInstallForcelist"
          if (!(Test-Path $edgePolicyPath)) { New-Item -Path $edgePolicyPath -Force | Out-Null }
          New-ItemProperty -Path $edgePolicyPath -Name "1" -Value "majdfhpaihoncoakbjgbdhglocklcgno;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $edgePolicyPath -Name "2" -Value "lfkgcfakbpblpflbjanpoaipofoodnen;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $edgePolicyPath -Name "3" -Value "panammoooggmlehahpcjckcncfeffcoi;https://edge.microsoft.com/extensionstore/v1/crx" -PropertyType String -Force | Out-Null

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Static hostname to preserve the exact same Tailscale IP address
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-rdp-runner --accept-routes
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "$env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

      - name: Maintain Connection & Auto-Trigger Next Run
        run: |
          Write-Host "`n=================="
          Write-Host "$env:TAILSCALE_IP"
          Write-Host "rdp"
          Write-Host "rdp123456"
          Write-Host "==================`n"
          
          # Wait 5 Hours 50 Minutes (350 minutes = 70 iterations of 5 minutes)
          for ($i = 0; $i -lt 70; $i++) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }

          Write-Host "Triggering next workflow session automatically..."
          
          $workflowFileName = [System.IO.Path]::GetFileName("$env:GITHUB_WORKFLOW_REF".Split('@')[0])
          $headers = @{
              "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
              "Accept"        = "application/vnd.github.v3+json"
          }
          $body = @{ ref = "$env:GITHUB_REF_NAME" } | ConvertTo-Json
          
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/$workflowFileName/dispatches" `
                            -Method Post -Headers $headers -Body $body -ContentType "application/json"
